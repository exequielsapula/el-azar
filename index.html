const themeWords = {
  identidad:["quién","soy","nombre","apellido","usted","yo","hombre","vacío"],
  llegada:["llegué","llegado","llegada","acá","aquí","venir","vino","estar"],
  volver:["volver","vuelva","regresar","casa","irme","salida","puerta"],
  vida:["vida","vivir","vivo","existir","existencia","viví","vivió"],
  muerte:["morir","muerto","muerte"],
  amor:["amar","amó","amor","quiero","quieren","amé","amó"],
  miedo:["miedo","temor","asust","dolor"],
  felicidad:["feliz","felicidad","satisfecho"],
  preguntas:["pregunta","preguntar","responde","respuesta","conteste","responder"],
  tiempo:["tiempo","hora","reloj","antes","después","todavía"],
  casa:["casa","cama","mesa","ventana","hogar"],
  sueño:["sueño","soñar","despierto","dormir"],
  expediente:["expediente","formulario","autorización","permiso"],
  dios:["dios"],
  decisión:["decisión","decido","quiero","necesito","puedo"],
  sufrimiento:["sufrir","sufrimiento","pérdida","perder","dolor","traición"]
};
const history=[];
let previous={HOMBRE:null,"VACÍO":null};

function pick(list){return list[Math.floor(Math.random()*list.length)]}

function themesOf(text){
  const t=text.toLowerCase();
  return Object.keys(themeWords).filter(k=>themeWords[k].some(w=>t.includes(w)));
}

function relevance(candidate, previousText, oppositeText){
  const ct=themesOf(candidate);
  const pt=themesOf(previousText||"");
  const ot=themesOf(oppositeText||"");
  let score=Math.random()*3; // azar real, dentro de un campo de opciones coherentes

  score += ct.filter(x=>pt.includes(x)).length*7;
  score += ct.filter(x=>ot.includes(x)).length*3;

  const q=/[¿?]/.test(previousText||"");
  const ex=/!/.test(previousText||"");
  if(q && !/[¿?]/.test(candidate)) score+=1.5;
  if(q && /[¿?]/.test(candidate)) score+=2;
  if(ex && candidate.length<70) score+=1;
  if(previousText && candidate.toLowerCase()===previousText.toLowerCase()) score-=12;

  // Respuestas naturales a ciertas formas de intervención.
  if(/\bde qué\b/i.test(previousText||"") && /^(de|porque|a|en|para)\b/i.test(candidate)) score+=6;
  if(/\bpor qué\b/i.test(previousText||"") && /^(porque|es|depende|puede|no|sí)\b/i.test(candidate)) score+=5;
  if(/\bquién\b/i.test(previousText||"") && /^(yo|nadie|usted|de|el|la)\b/i.test(candidate)) score+=4;
  if(/\busted\b/i.test(previousText||"") && /^(usted|yo|eso|no|sí|puede|depende)\b/i.test(candidate)) score+=2;

  return score;
}

function coherentLine(speaker, previousText, oppositeText){
  const list=source[speaker];
  const scored=list.map(text=>({text,score:relevance(text,previousText,oppositeText)}));
  scored.sort((a,b)=>b.score-a.score);
  // No toma siempre la mejor: sortea entre las 12 mejores.
  const pool=scored.slice(0,Math.min(12,scored.length));
  const chosen=pick(pool);
  const repeated=previous[speaker] && chosen.text===previous[speaker];
  return {text:chosen.text,repeated};
}

function maybeSilence(){return Math.random()<0.13}

function render(turn){
  const l=document.getElementById("dialogueLeft");
  const r=document.getElementById("dialogueRight");
  l.textContent=turn.left.text;
  r.textContent=turn.right.text;

  // El texto inicial sale de escena en la primera generación.
  l.classList.add("visible");
  r.classList.add("visible");
}

function generate(){
  let left,right;
  if(maybeSilence()){
    left={text:"…",silent:true,stage:pick(stageDirections)};
  }else{
    left=coherentLine("HOMBRE",previous["VACÍO"],previous.HOMBRE);
  }

  if(maybeSilence()){
    right={text:"…",silent:true,stage:pick(stageDirections)};
  }else{
    right=coherentLine("VACÍO",left.silent?"":left.text,previous["VACÍO"]);
  }

  previous.HOMBRE=left.silent?previous.HOMBRE:left.text;
  previous["VACÍO"]=right.silent?previous["VACÍO"]:right.text;
  history.push({left,right});
  render({left,right});
}


document.getElementById("generate").addEventListener("click", generate);

document.getElementById("clear").addEventListener("click", function(){
  // Limpia la escena visible y reinicia la memoria interna.
  history.length = 0;
  previous = {HOMBRE:null,"VACÍO":null};

  const l = document.getElementById("dialogueLeft");
  const r = document.getElementById("dialogueRight");
  l.textContent = "";
  r.textContent = "";
  l.classList.remove("visible");
  r.classList.remove("visible");
});

document.getElementById("download").addEventListener("click", function(){
  if(!history.length) return;
  const text = history.map((turn,i) =>
    `${i+1}.\nHOMBRE: ${turn.left.text}\nEL VACÍO: ${turn.right.text}`
  ).join("\n\n");
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dialogo-el-azar.txt";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
